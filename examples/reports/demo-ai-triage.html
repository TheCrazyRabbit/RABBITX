    card.appendChild(el("p","","Unverified provider hypothesis: "+text(item.possibleRisk)));
    card.appendChild(el("p","","Uncertainty: "+text(item.uncertainty)));card.appendChild(el("p","","Missing validation: "+text(item.missingValidation)));
    var refs=el("p","subtle","Evidence references: ");(item.evidenceIds||[]).forEach(function(id){var link=el("a","",id+" ");link.href="#"+id;refs.appendChild(link);});card.appendChild(refs);
    var action=item.nextAction||{};card.appendChild(el("p","","Next recommendation: "+text(action.reason)));card.appendChild(el("p","subtle",text(action.kind)+" "+text(action.method)+" "+text(action.url)+" | "+text(action.policyDecision)+" | Not executed"));triageSection.appendChild(card);
  });
  var catalogSection=section("Evidence catalog","Run-local IDs retained in project replay");(Array.isArray(data.evidenceCatalog)?data.evidenceCatalog:[]).forEach(function(item){if(item.detailsOmitted){var n=el("p","subtle",item.id+": evidence details omitted by report options");n.id=item.id;catalogSection.appendChild(n);}else evidence(catalogSection,item);});

  var endpointSection=section("Endpoint inventory","Prioritize review using classification, risk, and parameter signals"), endpoints=Array.isArray(data.endpoints)?data.endpoints:[];
  if(!endpoints.length){empty(endpointSection,"No endpoints were recorded.");}else{
    var rows=table(endpointSection,["Method","Endpoint","Class","Risk","Parameters / signals"]);
    endpoints.forEach(function(ep){var row=el("tr");cell(row,ep.method);cell(row,ep.url,"url");cell(row,ep.classification);var riskCell=el("td");riskCell.appendChild(badge(ep.riskScore&&ep.riskScore.level));riskCell.appendChild(el("div","subtle","Score: "+text(ep.riskScore&&ep.riskScore.score)));row.appendChild(riskCell);var signals=[];(Array.isArray(ep.parameters)?ep.parameters:[]).forEach(function(p){var item=text(p.name)+" ("+text(p.type)+")";if(Array.isArray(p.risks)&&p.risks.length)item+=" - "+p.risks.map(function(r){return text(r.type)+": "+text(r.level);}).join(", ");signals.push(item);});(Array.isArray(ep.riskHints)?ep.riskHints:[]).forEach(function(h){signals.push(text(h));});cell(row,signals.join("; "));rows.appendChild(row);});
  }

  var findingSection=section("Findings","Each item includes the recorded evidence snapshot"),findings=Array.isArray(data.findings)?data.findings:[];
  if(!findings.length){empty(findingSection,"No findings were recorded in this audit.");}else findings.forEach(function(f){var card=el("article","finding"),meta=el("div","meta");meta.appendChild(badge(f.status||"informational"));meta.appendChild(badge(f.severity));meta.appendChild(el("span","badge","Observation confidence: "+text(f.confidence)));meta.appendChild(el("span","subtle",f.ruleId));card.appendChild(meta);card.appendChild(el("h3","",f.title));card.appendChild(el("p","",f.description));if(f.evidence)card.appendChild(el("p","subtle",f.evidence));var details=el("details"),summary=el("summary","","Evidence ("+text(f.evidenceCount||1)+")");details.appendChild(summary);evidence(details,f.requestEvidence);(Array.isArray(f.relatedEvidence)?f.relatedEvidence:[]).forEach(function(item){evidence(details,item);});card.appendChild(details);findingSection.appendChild(card);});

  var probeSection=section("Probe history","Requests recorded during this audit"),probes=Array.isArray(data.probes)?data.probes:[];
  if(!probes.length){empty(probeSection,"No probes were recorded.");}else{var probeRows=table(probeSection,["Probe","Executed","Status","Requested URL","Error"]);probes.forEach(function(p){var row=el("tr");cell(row,p.name);cell(row,p.executed?"Yes":"No");cell(row,p.statusCode);cell(row,p.requestedUrl,"url");cell(row,p.error);probeRows.appendChild(row);});}
})();
